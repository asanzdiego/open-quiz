<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear partida · Open Quiz</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/js/teacher.js" type="module"></script>
  </head>
  <body>
    <main>
      <a href="/">Open Quiz</a>
      <h1>Crear partida</h1>
      <p id="connection-status" class="status" role="status">
        Conectando con el servidor…
      </p>
      <p id="form-error" class="error" role="alert" hidden></p>
      <p id="storage-warning" role="status" hidden></p>
      <button id="retry-restore" class="button secondary" hidden>
        Reintentar conexión con la partida
      </button>
      <form id="session-form">
        <label for="workbook-reference"
          >Ruta del fichero XLSX en Nextcloud</label
        >
        <input
          id="workbook-reference"
          name="workbookReference"
          type="text"
          required
          maxlength="1024"
          placeholder="Quiz/Matemáticas.xlsx"
          aria-describedby="reference-help"
        />
        <p id="reference-help" class="hint">
          Ruta relativa a la cuenta configurada en el servidor. Por ejemplo:
          Quiz/Matemáticas.xlsx.
        </p>
        <button id="submit-button" class="button" type="submit" disabled>
          Crear partida
        </button>
      </form>
      <section id="lobby" aria-labelledby="lobby-title" hidden>
        <h2 id="lobby-title">Sala de espera</h2>
        <p>Comparte este código con tus alumnos:</p>
        <p id="join-code" class="join-code"></p>
        <p><a id="student-link">Abrir entrada de alumnos</a></p>
        <p id="question-count"></p>
        <p id="participant-count" role="status"></p>
        <ul id="participants" aria-label="Participantes"></ul>
        <button
          id="start-game"
          class="button"
          data-game-event="teacher:start-game"
          disabled
        >
          Iniciar
        </button>
        <button
          class="button secondary"
          data-game-event="teacher:end-game"
          disabled
        >
          Finalizar partida
        </button>
      </section>
      <section id="game" aria-labelledby="game-title" hidden>
        <h2 id="game-title"></h2>
        <div id="question-panel">
          <p id="question-number"></p>
          <h3 id="question-text"></h3>
          <p id="countdown-panel">
            Tiempo restante: <strong id="countdown"></strong>
          </p>
          <div
            id="answer-options"
            class="answer-options"
            aria-label="Opciones de respuesta"
          ></div>
          <p id="answer-count" role="status"></p>
        </div>
        <p id="answer-feedback" hidden></p>
        <div id="question-result" hidden>
          <p id="correct-answer"></p>
          <p id="question-statistics"></p>
        </div>
        <p
          id="workbook-save-status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <div id="podium-panel" hidden>
          <h3>Podio</h3>
          <ol id="podium" class="ranking"></ol>
        </div>
        <div id="ranking-panel" hidden>
          <h3>Clasificación</h3>
          <ol id="ranking" class="ranking"></ol>
        </div>
        <div class="actions">
          <button
            id="retry-save-results"
            class="button"
            data-game-event="teacher:retry-save-results"
            hidden
          >
            Reintentar guardado
          </button>
          <button
            id="close-question"
            class="button"
            data-game-event="teacher:close-question"
            hidden
          >
            Cerrar pregunta
          </button>
          <button
            id="next-question"
            class="button"
            data-game-event="teacher:start-next-question"
            hidden
          >
            Siguiente pregunta
          </button>
          <button
            id="end-game"
            class="button secondary"
            data-game-event="teacher:end-game"
            hidden
          >
            Finalizar partida
          </button>
        </div>
      </section>
      <noscript><p>Activa JavaScript para crear una partida.</p></noscript>
    </main>
  </body>
</html>
